<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DOL CONVERT</title>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    min-height: 100%;
    font-family: Arial, "Noto Sans JP", sans-serif;
    background: #f4f6f8;
    color: #20242a;
}

body {
    padding: 28px;
}

button,
input,
select {
    font: inherit;
}

.app {
    max-width: 1120px;
    margin: 0 auto;
}

.header {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    margin-bottom: 22px;
}

.logo {
    font-size: 30px;
    font-weight: 800;
    letter-spacing: -1px;
}

.description {
    margin-top: 5px;
    color: #68727d;
    font-size: 13px;
}

.version {
    color: #7b858f;
    font-size: 12px;
}

.layout {
    display: grid;
    grid-template-columns: 240px 1fr;
    gap: 18px;
}

.panel {
    background: #fff;
    border: 1px solid #d7dce2;
    border-radius: 10px;
}

.sidebar {
    padding: 14px;
    height: fit-content;
}

.sidebar-title {
    padding: 7px 9px 11px;
    color: #6b7580;
    font-size: 12px;
    font-weight: 700;
}

.tool-button {
    width: 100%;
    padding: 12px;
    margin-bottom: 7px;
    border: 1px solid #d5dbe1;
    border-radius: 7px;
    background: #fff;
    color: #252b31;
    text-align: left;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
}

.tool-button:hover {
    border-color: #8d98a4;
}

.tool-button.active {
    border-color: #2563eb;
    background: #eef4ff;
    color: #174ea6;
}

.main {
    padding: 22px;
}

.title {
    margin: 0;
    font-size: 22px;
}

.subtitle {
    margin-top: 7px;
    color: #69747f;
    font-size: 13px;
}

.section {
    margin-top: 22px;
}

.section-title {
    margin-bottom: 10px;
    font-size: 14px;
    font-weight: 800;
}

.input-area {
    border: 2px dashed #aeb7c1;
    border-radius: 9px;
    padding: 28px;
    text-align: center;
    background: #fafbfc;
    cursor: pointer;
}

.input-area.drag {
    border-color: #2563eb;
    background: #f2f6ff;
}

.input-main {
    font-size: 15px;
    font-weight: 700;
}

.input-sub {
    margin-top: 7px;
    color: #737d88;
    font-size: 12px;
}

.file-list {
    margin-top: 11px;
    border-top: 1px solid #e0e4e8;
}

.file-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    padding: 11px 4px;
    border-bottom: 1px solid #e0e4e8;
}

.file-name {
    min-width: 0;
    font-size: 13px;
    word-break: break-all;
}

.file-size {
    margin-top: 3px;
    color: #7a838d;
    font-size: 11px;
}

.delete-file {
    flex-shrink: 0;
    padding: 6px 9px;
    border: 1px solid #d2d7dd;
    border-radius: 6px;
    background: #fff;
    cursor: pointer;
    font-size: 12px;
}

.empty {
    padding: 14px 4px;
    color: #7b858f;
    font-size: 12px;
}

.pipeline {
    border: 1px solid #d7dce2;
    border-radius: 9px;
    overflow: hidden;
}

.step {
    position: relative;
    display: grid;
    grid-template-columns: 42px 1fr auto;
    align-items: center;
    gap: 12px;
    padding: 13px;
    border-bottom: 1px solid #e0e4e8;
    background: #fff;
}

.step:last-child {
    border-bottom: 0;
}

.step-number {
    width: 30px;
    height: 30px;
    display: flex;
    justify-content: center;
    align-items: center;
    border: 1px solid #cbd2d9;
    border-radius: 6px;
    background: #f7f8f9;
    font-size: 12px;
    font-weight: 800;
}

.step-name {
    font-size: 13px;
    font-weight: 700;
}

.step-description {
    margin-top: 3px;
    color: #747e89;
    font-size: 11px;
}

.step-select {
    min-width: 190px;
    padding: 8px 9px;
    border: 1px solid #cbd2d9;
    border-radius: 6px;
    background: #fff;
    font-size: 12px;
}

.step-remove {
    padding: 7px 9px;
    border: 1px solid #d2d7dd;
    border-radius: 6px;
    background: #fff;
    cursor: pointer;
    font-size: 11px;
}

.add-step {
    width: 100%;
    margin-top: 9px;
    padding: 10px;
    border: 1px solid #cbd2d9;
    border-radius: 7px;
    background: #fff;
    cursor: pointer;
    font-size: 12px;
    font-weight: 700;
}

.add-step:hover {
    background: #f7f8f9;
}

.actions {
    display: flex;
    gap: 8px;
    margin-top: 18px;
}

.primary,
.secondary {
    padding: 11px 16px;
    border-radius: 7px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 700;
}

.primary {
    border: 1px solid #2563eb;
    background: #2563eb;
    color: #fff;
}

.primary:disabled {
    opacity: .45;
    cursor: not-allowed;
}

.secondary {
    border: 1px solid #cbd2d9;
    background: #fff;
    color: #29313a;
}

.status {
    margin-top: 17px;
    padding: 12px;
    border: 1px solid #dce1e6;
    border-radius: 7px;
    background: #f3f5f7;
    color: #59636e;
    font-size: 12px;
    line-height: 1.7;
    white-space: pre-wrap;
}

.result {
    display: none;
    margin-top: 17px;
    padding: 15px;
    border: 1px solid #cdd6df;
    border-radius: 8px;
    background: #fff;
}

.result.show {
    display: block;
}

.result-title {
    margin-bottom: 8px;
    font-size: 12px;
    color: #68727d;
}

.result-name {
    margin-bottom: 13px;
    font-size: 15px;
    font-weight: 800;
    word-break: break-all;
}

.download {
    width: 100%;
    padding: 11px;
    border: 1px solid #2563eb;
    border-radius: 7px;
    background: #2563eb;
    color: #fff;
    cursor: pointer;
    font-weight: 700;
}

.log {
    margin-top: 13px;
    padding-top: 12px;
    border-top: 1px solid #e0e4e8;
    color: #69747f;
    font-size: 11px;
    line-height: 1.7;
    white-space: pre-wrap;
}

.hidden {
    display: none !important;
}

@media (max-width: 760px) {
    body {
        padding: 15px;
    }

    .header {
        display: block;
    }

    .version {
        margin-top: 8px;
    }

    .layout {
        grid-template-columns: 1fr;
    }

    .step {
        grid-template-columns: 35px 1fr;
    }

    .step-select,
    .step-remove {
        grid-column: 2;
        width: 100%;
    }
}
</style>
</head>

<body>

<div class="app">

    <header class="header">
        <div>
            <div class="logo">DOL CONVERT</div>
            <div class="description">ファイル変換・統合ツール</div>
        </div>

        <div class="version">Browser Edition</div>
    </header>

    <div class="layout">

        <aside class="panel sidebar">

            <div class="sidebar-title">
                変換ツール
            </div>

            <button class="tool-button active" data-tool="mcaddon">
                MCAddon作成
            </button>

            <button class="tool-button" data-tool="zip">
                ZIP作成
            </button>

        </aside>

        <main class="panel main">

            <h1 class="title" id="title">
                MCAddon作成
            </h1>

            <div class="subtitle" id="subtitle">
                複数のファイルを指定した変換工程に通して、最終ファイルを作成します。
            </div>

            <section class="section">

                <div class="section-title">
                    1. ファイル
                </div>

                <div class="input-area" id="dropArea">

                    <div class="input-main">
                        ファイルを追加
                    </div>

                    <div class="input-sub">
                        クリックまたはドラッグ＆ドロップ
                    </div>

                    <input
                        id="fileInput"
                        type="file"
                        multiple
                        hidden
                    >

                </div>

                <div class="file-list" id="fileList">
                    <div class="empty">
                        ファイルが追加されていません。
                    </div>
                </div>

            </section>

            <section class="section">

                <div class="section-title">
                    2. 変換工程
                </div>

                <div class="pipeline" id="pipeline"></div>

                <button class="add-step" id="addStep">
                    ＋ 変換工程を追加
                </button>

            </section>

            <div class="actions">

                <button class="primary" id="runButton">
                    変換を実行
                </button>

                <button class="secondary" id="resetButton">
                    リセット
                </button>

            </div>

            <div class="status" id="status">
                ファイルを追加して、変換工程を設定してください。
            </div>

            <div class="result" id="result">

                <div class="result-title">
                    変換完了
                </div>

                <div class="result-name" id="resultName">
                </div>

                <button class="download" id="downloadButton">
                    ダウンロード
                </button>

                <div class="log" id="log">
                </div>

            </div>

        </main>

    </div>

</div>

<script>
const state = {
    tool: "mcaddon",
    files: [],
    steps: [
        "extract"
    ],
    resultBlob: null,
    resultName: ""
};

const fileInput = document.getElementById("fileInput");
const dropArea = document.getElementById("dropArea");
const fileList = document.getElementById("fileList");
const pipeline = document.getElementById("pipeline");
const addStepButton = document.getElementById("addStep");
const runButton = document.getElementById("runButton");
const resetButton = document.getElementById("resetButton");
const status = document.getElementById("status");
const result = document.getElementById("result");
const resultName = document.getElementById("resultName");
const downloadButton = document.getElementById("downloadButton");
const log = document.getElementById("log");

const stepTypes = {
    extract: {
        name: "ZIPを展開",
        description: "ZIPファイルの中身を取り出します。"
    },

    detect: {
        name: "BP / RPを判定",
        description: "manifest.jsonを確認してパック種類を判定します。"
    },

    merge: {
        name: "ファイルを統合",
        description: "複数のファイル・パックを1つにまとめます。"
    },

    mcaddon: {
        name: "MCAddon化",
        description: "最終ファイルを.mcaddonとして出力します。"
    },

    zip: {
        name: "ZIP化",
        description: "ファイルをZIPアーカイブにします。"
    },

    rename: {
        name: "ファイル名を変更",
        description: "出力ファイル名を指定できます。"
    }
};

function renderFiles() {

    if (!state.files.length) {

        fileList.innerHTML = `
            <div class="empty">
                ファイルが追加されていません。
            </div>
        `;

        return;
    }

    fileList.innerHTML = "";

    state.files.forEach((file, index) => {

        const item = document.createElement("div");

        item.className = "file-item";

        item.innerHTML = `
            <div>
                <div class="file-name"></div>
                <div class="file-size"></div>
            </div>

            <button class="delete-file">
                削除
            </button>
        `;

        item.querySelector(".file-name").textContent = file.name;
        item.querySelector(".file-size").textContent = formatSize(file.size);

        item.querySelector(".delete-file").addEventListener("click", () => {

            state.files.splice(index, 1);

            renderFiles();

            updateStatus();

        });

        fileList.appendChild(item);
    });
}

function renderPipeline() {

    pipeline.innerHTML = "";

    state.steps.forEach((type, index) => {

        const step = document.createElement("div");

        step.className = "step";

        step.innerHTML = `
            <div class="step-number">
                ${index + 1}
            </div>

            <div>
                <div class="step-name"></div>
                <div class="step-description"></div>
            </div>

            <div>
                <select class="step-select">
                </select>

                <button class="step-remove">
                    削除
                </button>
            </div>
        `;

        const select = step.querySelector(".step-select");

        Object.entries(stepTypes).forEach(([key, data]) => {

            const option = document.createElement("option");

            option.value = key;
            option.textContent = data.name;

            if (key === type) {
                option.selected = true;
            }

            select.appendChild(option);
        });

        const name = step.querySelector(".step-name");
        const description = step.querySelector(".step-description");

        name.textContent = stepTypes[type].name;
        description.textContent = stepTypes[type].description;

        select.addEventListener("change", () => {

            state.steps[index] = select.value;

            renderPipeline();

            updateStatus();

        });

        step.querySelector(".step-remove").addEventListener("click", () => {

            state.steps.splice(index, 1);

            renderPipeline();

            updateStatus();

        });

        pipeline.appendChild(step);

    });

}

function addFiles(files) {

    for (const file of files) {
        state.files.push(file);
    }

    renderFiles();

    updateStatus();

}

function formatSize(size) {

    if (size < 1024) {
        return size + " B";
    }

    if (size < 1024 * 1024) {
        return (size / 1024).toFixed(1) + " KB";
    }

    return (size / 1024 / 1024).toFixed(1) + " MB";
}

function updateStatus() {

    if (!state.files.length) {

        status.textContent =
            "ファイルを追加して、変換工程を設定してください。";

        runButton.disabled = true;

        return;
    }

    if (!state.steps.length) {

        status.textContent =
            "変換工程がありません。";

        runButton.disabled = true;

        return;
    }

    runButton.disabled = false;

    status.textContent =
        "入力ファイル: " + state.files.length + "個\n" +
        "変換工程: " + state.steps.length + "個\n\n" +
        state.steps
            .map((step, index) => {
                return (index + 1) + ". " + stepTypes[step].name;
            })
            .join("\n");

}

dropArea.addEventListener("click", () => {
    fileInput.click();
});

fileInput.addEventListener("change", event => {

    addFiles([...event.target.files]);

    fileInput.value = "";

});

dropArea.addEventListener("dragover", event => {

    event.preventDefault();

    dropArea.classList.add("drag");

});

dropArea.addEventListener("dragleave", () => {

    dropArea.classList.remove("drag");

});

dropArea.addEventListener("drop", event => {

    event.preventDefault();

    dropArea.classList.remove("drag");

    addFiles([...event.dataTransfer.files]);

});

addStepButton.addEventListener("click", () => {

    state.steps.push("merge");

    renderPipeline();

    updateStatus();

});

resetButton.addEventListener("click", () => {

    state.files = [];

    state.steps = ["extract"];

    state.resultBlob = null;

    state.resultName = "";

    result.classList.remove("show");

    renderFiles();

    renderPipeline();

    updateStatus();

});

document.querySelectorAll(".tool-button").forEach(button => {

    button.addEventListener("click", () => {

        document.querySelectorAll(".tool-button")
            .forEach(item => item.classList.remove("active"));

        button.classList.add("active");

        state.tool = button.dataset.tool;

        if (state.tool === "mcaddon") {

            document.getElementById("title").textContent =
                "MCAddon作成";

            document.getElementById("subtitle").textContent =
                "複数のファイルを指定した変換工程に通して、最終的にMCAddonを作成します。";

            state.steps = [
                "extract",
                "detect",
                "merge",
                "mcaddon"
            ];

        } else {

            document.getElementById("title").textContent =
                "ZIP作成";

            document.getElementById("subtitle").textContent =
                "複数のファイルを指定した工程でまとめてZIPにします。";

            state.steps = [
                "merge",
                "zip"
            ];

        }

        result.classList.remove("show");

        renderPipeline();

        updateStatus();

    });

});

runButton.addEventListener("click", async () => {

    if (!state.files.length) {
        return;
    }

    runButton.disabled = true;

    result.classList.remove("show");

    status.textContent =
        "変換を開始しています……";

    try {

        if (state.tool === "mcaddon") {

            await createMcaddon();

        } else {

            await createZip();

        }

    } catch (error) {

        status.textContent =
            "変換に失敗しました。\n\n" +
            error.message;

    }

    runButton.disabled = false;

});

async function createMcaddon() {

    let workingFiles = [...state.files];

    let output = new JSZip();

    let detectedBP = 0;
    let detectedRP = 0;
    let normalFiles = 0;

    for (let stepIndex = 0; stepIndex < state.steps.length; stepIndex++) {

        const step = state.steps[stepIndex];

        status.textContent =
            "変換中……\n\n" +
            "工程 " + (stepIndex + 1) +
            " / " + state.steps.length +
            "\n" +
            stepTypes[step].name;

        await sleep(120);

        if (step === "extract") {

            for (const file of workingFiles) {

                if (!file.name.toLowerCase().endsWith(".zip")) {
                    continue;
                }

                const zip = await JSZip.loadAsync(file);

                zip.forEach((path, entry) => {

                    if (!entry.dir) {
                        output.file(
                            "INPUT_" +
                            safeName(file.name) +
                            "/" +
                            path,
                            entry
                        );
                    }

                });

            }

        }

        if (step === "detect") {

            for (const file of workingFiles) {

                if (!file.name.toLowerCase().endsWith(".zip")) {
                    continue;
                }

                const zip = await JSZip.loadAsync(file);

                let foundBP = false;
                let foundRP = false;

                for (const path of Object.keys(zip.files)) {

                    if (!path.toLowerCase().endsWith("manifest.json")) {
                        continue;
                    }

                    try {

                        const text =
                            await zip.files[path].async("text");

                        const manifest =
                            JSON.parse(text);

                        const modules =
                            Array.isArray(manifest.modules)
                                ? manifest.modules
                                : [];

                        for (const module of modules) {

                            if (
                                module.type === "data" ||
                                module.type === "script"
                            ) {
                                foundBP = true;
                            }

                            if (
                                module.type === "resources"
                            ) {
                                foundRP = true;
                            }

                        }

                    } catch (error) {
                    }

                }

                if (foundBP) {
                    detectedBP++;
                }

                if (foundRP) {
                    detectedRP++;
                }

            }

        }

        if (step === "merge") {

            output = new JSZip();

            const used = new Set();

            for (const file of workingFiles) {

                const lower =
                    file.name.toLowerCase();

                if (lower.endsWith(".zip")) {

                    const zip =
                        await JSZip.loadAsync(file);

                    zip.forEach((path, entry) => {

                        if (entry.dir) {
                            return;
                        }

                        const finalPath =
                            uniquePath(
                                path,
                                used
                            );

                        output.file(
                            finalPath,
                            entry
                        );

                    });

                } else {

                    const finalPath =
                        uniquePath(
                            file.name,
                            used
                        );

                    output.file(
                        finalPath,
                        new Uint8Array(
                            await file.arrayBuffer()
                        )
                    );

                    normalFiles++;

                }

            }

        }

        if (step === "mcaddon") {

            if (output.file(/./).length === 0) {

                for (const file of workingFiles) {

                    output.file(
                        file.name,
                        new Uint8Array(
                            await file.arrayBuffer()
                        )
                    );

                }

            }

        }

    }

    const blob =
        await output.generateAsync({
            type: "blob",
            compression: "DEFLATE"
        });

    const name =
        "DOL_ADDON_" +
        getDateString() +
        ".mcaddon";

    state.resultBlob = blob;
    state.resultName = name;

    resultName.textContent = name;

    log.textContent =
        "処理完了\n\n" +
        "入力ファイル: " +
        state.files.length +
        "個\n" +
        "BP検出: " +
        detectedBP +
        "個\n" +
        "RP検出: " +
        detectedRP +
        "個\n" +
        "変換工程: " +
        state.steps.length +
        "個";

    result.classList.add("show");

    status.textContent =
        "変換が完了しました。";

}

async function createZip() {

    const output = new JSZip();

    const used = new Set();

    for (const file of state.files) {

        output.file(
            uniquePath(
                file.name,
                used
            ),
            new Uint8Array(
                await file.arrayBuffer()
            )
        );

    }

    const blob =
        await output.generateAsync({
            type: "blob",
            compression: "DEFLATE"
        });

    const name =
        "DOL_CONVERT_" +
        getDateString() +
        ".zip";

    state.resultBlob = blob;
    state.resultName = name;

    resultName.textContent = name;

    log.textContent =
        "処理完了\n\n" +
        "入力ファイル: " +
        state.files.length +
        "個\n" +
        "収録ファイル: " +
        used.size +
        "個";

    result.classList.add("show");

    status.textContent =
        "ZIPの作成が完了しました。";

}

downloadButton.addEventListener("click", () => {

    if (!state.resultBlob) {
        return;
    }

    const url =
        URL.createObjectURL(
            state.resultBlob
        );

    const link =
        document.createElement("a");

    link.href = url;
    link.download = state.resultName;

    document.body.appendChild(link);

    link.click();

    link.remove();

    setTimeout(() => {
        URL.revokeObjectURL(url);
    }, 1000);

});

function uniquePath(path, used) {

    path =
        path.replace(/^\/+/, "");

    if (!used.has(path)) {

        used.add(path);

        return path;

    }

    const dot =
        path.lastIndexOf(".");

    const base =
        dot > 0
            ? path.slice(0, dot)
            : path;

    const ext =
        dot > 0
            ? path.slice(dot)
            : "";

    let number = 2;

    let newPath =
        base +
        "_" +
        number +
        ext;

    while (used.has(newPath)) {

        number++;

        newPath =
            base +
            "_" +
            number +
            ext;

    }

    used.add(newPath);

    return newPath;

}

function safeName(name) {

    return name
        .replace(/[\\/:*?"<>|]/g, "_")
        .replace(/\.zip$/i, "");

}

function getDateString() {

    const date =
        new Date();

    const pad =
        number =>
            String(number).padStart(2, "0");

    return (
        date.getFullYear() +
        pad(date.getMonth() + 1) +
        pad(date.getDate()) +
        "_" +
        pad(date.getHours()) +
        pad(date.getMinutes()) +
        pad(date.getSeconds())
    );

}

function sleep(ms) {

    return new Promise(
        resolve => setTimeout(resolve, ms)
    );

}

renderFiles();
renderPipeline();
updateStatus();
</script>
