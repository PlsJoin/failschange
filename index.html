<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DOL CONVERT</title>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Arial,"Noto Sans JP",sans-serif;background:#f5f7fa;color:#20242a}
body{padding:28px}
.app{max-width:1100px;margin:auto}
header{display:flex;justify-content:space-between;align-items:end;margin-bottom:24px}
.logo{font-size:30px;font-weight:800;letter-spacing:-1px}
.sub{margin-top:5px;font-size:13px;color:#64707d}
.version{font-size:12px;color:#64707d}
.grid{display:grid;grid-template-columns:250px 1fr;gap:18px}
.panel{background:#fff;border:1px solid #d8dde4;border-radius:12px}
.side{padding:14px}
.side-title{font-size:12px;font-weight:700;color:#68727d;padding:8px 10px 10px}
.mode{width:100%;border:1px solid #d8dde4;background:#fff;border-radius:8px;padding:13px 12px;text-align:left;font-size:14px;font-weight:700;cursor:pointer;margin-bottom:7px}
.mode:hover{border-color:#8b98a7}
.mode.active{border-color:#2563eb;background:#eff5ff;color:#174ea6}
.main{padding:22px}
h1{font-size:21px;margin:0 0 7px}
.desc{font-size:13px;color:#65717e;margin-bottom:20px}
.drop{border:2px dashed #aeb8c4;border-radius:10px;padding:38px 20px;text-align:center;background:#fbfcfd;cursor:pointer}
.drop.drag{border-color:#2563eb;background:#f2f7ff}
.drop-title{font-size:16px;font-weight:700}
.drop-text{font-size:13px;color:#68727d;margin-top:8px}
input[type=file]{display:none}
.actions{display:flex;gap:9px;margin-top:13px}
button{font-family:inherit}
.primary,.secondary{border-radius:8px;padding:11px 15px;font-size:13px;font-weight:700;cursor:pointer}
.primary{background:#2563eb;color:white;border:1px solid #2563eb}
.primary:disabled{opacity:.45;cursor:not-allowed}
.secondary{background:white;color:#29313a;border:1px solid #cbd2da}
.section{margin-top:22px}
.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}
.section-title{font-size:14px;font-weight:800}
.count{font-size:12px;color:#68727d}
.files{border-top:1px solid #e1e5ea}
.file{display:flex;align-items:center;justify-content:space-between;padding:12px 4px;border-bottom:1px solid #e1e5ea;gap:10px}
.file-name{font-size:13px;word-break:break-all}
.file-meta{font-size:11px;color:#77818c;margin-top:3px}
.remove{border:1px solid #d5dae0;background:#fff;border-radius:6px;padding:6px 9px;cursor:pointer;font-size:12px}
.empty{padding:18px 4px;color:#7a838d;font-size:13px}
.status{margin-top:18px;padding:12px;border-radius:8px;background:#f1f4f7;border:1px solid #dce1e6;font-size:12px;white-space:pre-wrap}
.notice{margin-top:18px;padding:13px;border-left:3px solid #2563eb;background:#f4f7fb;font-size:12px;line-height:1.7}
.result{margin-top:18px;padding:15px;border:1px solid #cfd7e0;border-radius:9px;background:#fff;display:none}
.result.show{display:block}
.result-row{display:flex;justify-content:space-between;gap:15px;align-items:center}
.result-name{font-size:14px;font-weight:800;word-break:break-all}
.log{margin-top:10px;font-size:12px;line-height:1.7;color:#59636e;white-space:pre-wrap}
footer{margin-top:18px;text-align:center;font-size:11px;color:#8a939c}
@media(max-width:750px){
body{padding:15px}
header{display:block}
.version{margin-top:8px}
.grid{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="app">
<header>
  <div>
    <div class="logo">DOL CONVERT</div>
    <div class="sub">ファイル変換・統合ツール</div>
  </div>
  <div class="version">Browser Edition</div>
</header>

<div class="grid">
  <aside class="panel side">
    <div class="side-title">変換モード</div>
    <button class="mode active" data-mode="mcaddon">MCAddon 統合</button>
    <button class="mode" data-mode="zip">ZIP作成</button>
  </aside>

  <main class="panel main">
    <h1 id="title">MCAddon 統合</h1>
    <div class="desc" id="desc">複数のZIP・フォルダ・ファイルをまとめて、Minecraft Bedrock用のMCAddonにします。</div>

    <div class="drop" id="drop">
      <div class="drop-title">ファイルをここにドロップ</div>
      <div class="drop-text">またはクリックして複数ファイルを選択</div>
      <input id="picker" type="file" multiple>
    </div>

    <div class="actions">
      <button class="primary" id="convert" disabled>MCAddonを作成</button>
      <button class="secondary" id="clear">すべて削除</button>
    </div>

    <div class="section">
      <div class="section-head">
        <div class="section-title">追加ファイル</div>
        <div class="count" id="count">0個</div>
      </div>
      <div class="files" id="files"><div class="empty">まだファイルがありません。</div></div>
    </div>

    <div class="status" id="status">ファイルを追加すると解析結果がここに表示されます。</div>

    <div class="result" id="result">
      <div class="result-row">
        <div class="result-name" id="resultName"></div>
        <button class="primary" id="download">ダウンロード</button>
      </div>
      <div class="log" id="log"></div>
    </div>

    <div class="notice">
      MCAddonモードでは、ZIPの中身を展開してBP/RPのmanifest.jsonを確認し、複数パックを同じアーカイブへまとめます。
      生成処理はこのブラウザ内で行います。
    </div>
  </main>
</div>
<footer>DOL CONVERT</footer>
</div>

<script>
const state={mode:"mcaddon",files:[],result:null};

const drop=document.getElementById("drop");
const picker=document.getElementById("picker");
const filesEl=document.getElementById("files");
const countEl=document.getElementById("count");
const convertBtn=document.getElementById("convert");
const statusEl=document.getElementById("status");
const resultEl=document.getElementById("result");
const resultNameEl=document.getElementById("resultName");
const logEl=document.getElementById("log");
const downloadBtn=document.getElementById("download");

document.querySelectorAll(".mode").forEach(btn=>{
  btn.addEventListener("click",()=>{
    document.querySelectorAll(".mode").forEach(x=>x.classList.remove("active"));
    btn.classList.add("active");
    state.mode=btn.dataset.mode;
    document.getElementById("title").textContent=state.mode==="mcaddon"?"MCAddon 統合":"ZIP作成";
    document.getElementById("desc").textContent=state.mode==="mcaddon"
      ?"複数のZIP・フォルダ・ファイルをまとめて、Minecraft Bedrock用のMCAddonにします。"
      :"追加したファイルを1つのZIPにまとめます。";
    convertBtn.textContent=state.mode==="mcaddon"?"MCAddonを作成":"ZIPを作成";
    resultEl.classList.remove("show");
    analyze();
  });
});

drop.addEventListener("click",()=>picker.click());
picker.addEventListener("change",e=>addFiles([...e.target.files]));
["dragenter","dragover"].forEach(type=>drop.addEventListener(type,e=>{
  e.preventDefault();drop.classList.add("drag");
}));
["dragleave","drop"].forEach(type=>drop.addEventListener(type,e=>{
  e.preventDefault();drop.classList.remove("drag");
}));
drop.addEventListener("drop",e=>addFiles([...e.dataTransfer.files]));

document.getElementById("clear").addEventListener("click",()=>{
  state.files=[];
  state.result=null;
  picker.value="";
  resultEl.classList.remove("show");
  renderFiles();
  analyze();
});

convertBtn.addEventListener("click",()=>state.mode==="mcaddon"?createMcaddon():createZip());
downloadBtn.addEventListener("click",()=>{
  if(!state.result)return;
  const a=document.createElement("a");
  a.href=URL.createObjectURL(state.result.blob);
  a.download=state.result.name;
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
});

function addFiles(files){
  for(const file of files){
    state.files.push(file);
  }
  renderFiles();
  analyze();
}

function renderFiles(){
  countEl.textContent=state.files.length+"個";
  if(!state.files.length){
    filesEl.innerHTML='<div class="empty">まだファイルがありません。</div>';
    return;
  }
  filesEl.innerHTML="";
  state.files.forEach((file,index)=>{
    const row=document.createElement("div");
    row.className="file";
    const left=document.createElement("div");
    left.innerHTML='<div class="file-name"></div><div class="file-meta"></div>';
    left.querySelector(".file-name").textContent=file.name;
    left.querySelector(".file-meta").textContent=formatSize(file.size);
    const remove=document.createElement("button");
    remove.className="remove";
    remove.textContent="削除";
    remove.onclick=()=>{
      state.files.splice(index,1);
      renderFiles();
      analyze();
    };
    row.append(left,remove);
    filesEl.appendChild(row);
  });
}

function formatSize(bytes){
  if(bytes<1024)return bytes+" B";
  if(bytes<1024*1024)return (bytes/1024).toFixed(1)+" KB";
  return (bytes/1024/1024).toFixed(1)+" MB";
}

function analyze(){
  if(!state.files.length){
    statusEl.textContent="ファイルを追加すると解析結果がここに表示されます。";
    convertBtn.disabled=true;
    return;
  }
  if(state.mode==="zip"){
    statusEl.textContent="追加された "+state.files.length+" 個のファイルをZIPにまとめられます。";
    convertBtn.disabled=false;
    return;
  }
  const zips=state.files.filter(f=>f.name.toLowerCase().endsWith(".zip"));
  const mcaddons=state.files.filter(f=>f.name.toLowerCase().endsWith(".mcaddon"));
  const others=state.files.length-zips.length-mcaddons.length;
  statusEl.textContent=
    "ZIP: "+zips.length+"個\n"+
    "MCAddon: "+mcaddons.length+"個\n"+
    "その他: "+others+"個\n\n"+
    "ZIPを展開してmanifest.jsonを確認し、BP/RPを判定します。";
  convertBtn.disabled=false;
}

async function readZip(file){
  const zip=await JSZip.loadAsync(file);
  return zip;
}

function safeName(name){
  return name.replace(/[\\\\/:*?"<>|]/g,"_").trim()||"addon";
}

async function inspectZip(zip){
  const manifests=[];
  zip.forEach((path,obj)=>{
    if(!obj.dir && path.toLowerCase().endsWith("manifest.json"))manifests.push(path);
  });
  const packs=[];
  for(const path of manifests){
    try{
      const text=await zip.file(path).async("text");
      const json=JSON.parse(text);
      const modules=Array.isArray(json.modules)?json.modules:[];
      const types=modules.map(m=>m.type);
      const isBP=types.includes("data")||types.includes("script");
      const isRP=types.includes("resources");
      packs.push({path,json,isBP,isRP});
    }catch(e){}
  }
  return packs;
}

async function createMcaddon(){
  convertBtn.disabled=true;
  resultEl.classList.remove("show");
  statusEl.textContent="変換中です。ZIPを確認しています……";
  try{
    const output=new JSZip();
    const used=new Set();
    let bp=0,rp=0,other=0;

    for(const file of state.files){
      const lower=file.name.toLowerCase();

      if(lower.endsWith(".mcaddon")){
        const inner=await readZip(file);
        for(const [path,obj] of Object.entries(inner.files)){
          if(obj.dir)continue;
          const clean=uniquePath(path,used);
          output.file(clean,await obj.async("uint8array"));
        }
        continue;
      }

      if(lower.endsWith(".zip")){
        const inner=await readZip(file);
        const info=await inspectZip(inner);

        let prefix="";
        if(info.some(x=>x.isBP)){bp++;prefix="BP_"+safeName(file.name.replace(/\\.zip$/i,""))+"/";}
        else if(info.some(x=>x.isRP)){rp++;prefix="RP_"+safeName(file.name.replace(/\\.zip$/i,""))+"/";}
        else{other++;prefix=safeName(file.name.replace(/\\.zip$/i,""))+"/";}

        for(const [path,obj] of Object.entries(inner.files)){
          if(obj.dir)continue;
          const clean=uniquePath(prefix+path,used);
          output.file(clean,await obj.async("uint8array"));
        }
      }else{
        other++;
        const clean=uniquePath(file.name,used);
        output.file(clean,new Uint8Array(await file.arrayBuffer()));
      }
    }

    if(!used.size)throw new Error("出力できるファイルがありません。");

    const blob=await output.generateAsync({type:"blob",compression:"DEFLATE"});
    const name="DOL_CONVERT_"+dateName()+".mcaddon";
    state.result={blob,name};
    resultNameEl.textContent=name;
    logEl.textContent=
      "統合完了\n"+
      "BP候補: "+bp+"個\n"+
      "RP候補: "+rp+"個\n"+
      "その他: "+other+"個\n"+
      "出力ファイル: "+used.size+"個";
    resultEl.classList.add("show");
    statusEl.textContent="MCAddonの作成が完了しました。";
  }catch(error){
    statusEl.textContent="変換に失敗しました。\n"+error.message;
  }finally{
    convertBtn.disabled=false;
  }
}

async function createZip(){
  convertBtn.disabled=true;
  resultEl.classList.remove("show");
  statusEl.textContent="ZIPを作成しています……";
  try{
    const output=new JSZip();
    const used=new Set();
    for(const file of state.files){
      output.file(uniquePath(file.name,used),new Uint8Array(await file.arrayBuffer()));
    }
    const blob=await output.generateAsync({type:"blob",compression:"DEFLATE"});
    const name="DOL_CONVERT_"+dateName()+".zip";
    state.result={blob,name};
    resultNameEl.textContent=name;
    logEl.textContent="ZIP作成完了\n収録ファイル: "+used.size+"個";
    resultEl.classList.add("show");
    statusEl.textContent="ZIPの作成が完了しました。";
  }catch(error){
    statusEl.textContent="ZIP作成に失敗しました。\n"+error.message;
  }finally{
    convertBtn.disabled=false;
  }
}

function uniquePath(path,used){
  path=path.replace(/^\\/+/,"");
  if(!used.has(path)){used.add(path);return path;}
  const dot=path.lastIndexOf(".");
  const base=dot>0?path.slice(0,dot):path;
  const ext=dot>0?path.slice(dot):"";
  let i=2;
  let next=base+"_"+i+ext;
  while(used.has(next))next=base+"_"+(++i)+ext;
  used.add(next);
  return next;
}

function dateName(){
  const d=new Date();
  const p=n=>String(n).padStart(2,"0");
  return d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+"_"+p(d.getHours())+p(d.getMinutes())+p(d.getSeconds());
}

renderFiles();
</script>
</body>
</html>
