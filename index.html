<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>生産性皆無の部屋</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background-color: #111;
            color: #fff;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 20px;
            color: #555;
            user-select: none;
        }

        /* 逃げるボタンのスタイル */
        #escape-btn {
            position: absolute;
            padding: 15px 30px;
            font-size: 1.2rem;
            font-weight: bold;
            background-color: #ff4757;
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 71, 87, 0.4);
            transition: transform 0.1s ease;
        }

        /* 煽りテキストのスタイル */
        #msg {
            position: absolute;
            top: 20%;
            font-size: 2rem;
            font-weight: bold;
            color: #ffd32a;
            text-shadow: 0 0 10px rgba(255, 211, 42, 0.5);
            opacity: 0;
            transition: opacity 0.3s ease;
            user-select: none;
            text-align: center;
        }
    </style>
</head>
<body>

    <h1>暇つぶし専用（生産性：0）</h1>
    <div id="msg">ほらほらーー！！</div>
    <button id="escape-btn">ここをクリック</button>

    <script>
        const btn = document.getElementById('escape-btn');
        const msg = document.getElementById('msg');

        // 煽り文句のバリエーション
        const insults = [
            "遅いお！遅すぎるお！",
            "当ててみなーー！お！",
            "あ、逃げたおｗｗｗ",
            "エイム悪すぎだお？",
            "クリックされたら悔しいお！",
            "虚無だお！楽しいかおこれ？"
        ];

        // 最初は画面中央付近に配置
        btn.style.left = 'calc(50% - 75px)';
        btn.style.top = 'calc(50% - 25px)';

        // マウスが近づいた（またはタップしようとした）時の処理
        function escape(e) {
            // 画面の幅と高さ（ボタンがはみ出さないようにマージンを取る）
            const padding = 100;
            const maxX = window.innerWidth - padding;
            const maxY = window.innerHeight - padding;

            // ランダムな座標にワープ
            const newX = Math.random() * (maxX - padding) + padding / 2;
            const newY = Math.random() * (maxY - padding) + padding / 2;

            btn.style.left = `${newX}px`;
            btn.style.top = `${newY}px`;

            // ランダムに煽り文句を表示
            const randomMsg = insults[Math.floor(Math.random() * insults.length)];
            msg.innerText = randomMsg;
            msg.style.opacity = 1;

            // ちょっとボタンを大きくして煽る
            btn.style.transform = `scale(${1 + Math.random() * 0.3})`;
        }

        // マウスホバーとタッチイベントの両方に対応
        btn.addEventListener('mouseenter', escape);
        btn.addEventListener('touchstart', (e) => {
            e.preventDefault(); // スマホでのズーム等を防ぐ
            escape();
        });

        // 万が一クリックできちゃった時（基本無理だけどPCのバグ等で）
        btn.addEventListener('click', () => {
            alert('！？！？ クリックできちゃったお…あなたの勝ちだお…（虚無）');
        });
    </script>
</body>
</html>
